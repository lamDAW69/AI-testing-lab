services:
  # 1. Reverse Proxy con SSL Automático y Headers de Seguridad
  caddy:
    image: caddy:2-alpine
    container_name: app_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_internal_network
    depends_on:
      - api

  # 2. Base de Datos PostgreSQL (100% aislada de Internet)
  postgres:
    image: postgres:16-alpine
    container_name: app_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # NOTA: En producción NO se publica ningún puerto hacia el host ni hacia Internet

  # Las migraciones requieren DDL; se ejecutan una vez con la cuenta bootstrap.
  # API y worker nunca reciben estas credenciales y permanecen bajo app_runtime.
  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: app_migrate
    restart: "no"
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_USER:-app_runtime}:${APP_DB_PASSWORD}@postgres:5432/${DB_NAME:-app_db}
      ADMIN_DATABASE_URL: postgresql://${DB_USER:-app_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-app_db}
      SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL}
    networks:
      - app_internal_network

  # 3. API Backend en Node.js / TypeScript
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: app_api
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      document-storage-init:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      NODE_ENV: production
      # Cuenta de mínimo privilegio distinta del propietario administrativo de
      # PostgreSQL. Debe existir antes de arrancar la API en producción.
      DATABASE_URL: postgresql://${APP_DB_USER:-app_runtime}:${APP_DB_PASSWORD}@postgres:5432/${DB_NAME:-app_db}
      SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Se exige explícitamente en producción: protege el endpoint interno de
      # ingesta contra ejecuciones no autorizadas.
      INGEST_SECRET: ${INGEST_SECRET}
      DOCUMENT_STORAGE_DIR: /app/data/documents
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_MAX_DOCUMENT_CHARS: ${GEMINI_MAX_DOCUMENT_CHARS:-250000}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-8000}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-45000}
    volumes:
      - document_storage:/app/data/documents
    networks:
      - app_internal_network
    # La API no expone puertos a Internet; Caddy gestiona todo el tráfico entrante

  # Worker aislado: reclama trabajos durables con SKIP LOCKED; no expone puertos.
  extraction-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: app_extraction_worker
    restart: always
    command: ["node", "dist/modules/requirements/extraction-jobs.worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_USER:-app_runtime}:${APP_DB_PASSWORD}@postgres:5432/${DB_NAME:-app_db}
      SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      INGEST_SECRET: ${INGEST_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_MAX_DOCUMENT_CHARS: ${GEMINI_MAX_DOCUMENT_CHARS:-250000}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-8000}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-45000}
    networks:
      - app_internal_network

  # Inicialización explícita del volumen: la API permanece como usuario no-root
  # y no necesita permisos de administración para almacenar documentos.
  document-storage-init:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "-c", "mkdir -p /documents && chown -R 10001:10001 /documents && chmod 700 /documents"]
    volumes:
      - document_storage:/documents

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  document_storage:
    driver: local

networks:
  app_internal_network:
    driver: bridge
