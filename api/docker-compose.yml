services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: app_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secreto_seguro_cambiar}
      POSTGRES_DB: ${DB_NAME:-app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_internal_network
    ports:
      - "127.0.0.1:5432:5432"

  # API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_api
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-app_user}:${DB_PASSWORD:-secreto_seguro_cambiar}@postgres:5432/${DB_NAME:-app_db}
      SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app_internal_network

volumes:
  postgres_data:
    driver: local

networks:
  app_internal_network:
    driver: bridge
